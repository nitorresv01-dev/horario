  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Planificador 40H - Turnos Farmacia</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 18 & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone para interpretar React en el navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

</head>
<body class="bg-slate-200 text-slate-800 antialiased font-sans min-h-screen pb-24">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    // --- FERIADOS OFICIALES DE CHILE (2026 - 2027) ---
    const CHILE_HOLIDAYS = {
      '2026-01-01': { name: 'Año Nuevo', irrenunciable: true },
      '2026-04-03': { name: 'Viernes Santo', irrenunciable: false },
      '2026-04-04': { name: 'Sábado Santo', irrenunciable: false },
      '2026-05-01': { name: 'Día del Trabajo', irrenunciable: true },
      '2026-05-21': { name: 'Glorias Navales', irrenunciable: false },
      '2026-06-21': { name: 'Pueblos Indígenas', irrenunciable: false },
      '2026-06-29': { name: 'San Pedro y San Pablo', irrenunciable: false },
      '2026-07-16': { name: 'Virgen del Carmen', irrenunciable: false },
      '2026-08-15': { name: 'Asunción de la Virgen', irrenunciable: false },
      '2026-09-18': { name: 'Fiestas Patrias', irrenunciable: true },
      '2026-09-19': { name: 'Glorias del Ejército', irrenunciable: true },
      '2026-10-12': { name: 'Encuentro de Dos Mundos', irrenunciable: false },
      '2026-10-31': { name: 'Día Iglesias Evangélicas', irrenunciable: false },
      '2026-11-01': { name: 'Día de Todos los Santos', irrenunciable: false },
      '2026-12-08': { name: 'Inmaculada Concepción', irrenunciable: false },
      '2026-12-25': { name: 'Navidad', irrenunciable: true },
      '2027-01-01': { name: 'Año Nuevo', irrenunciable: true }
    };

    const MONTH_NAMES = [
      'Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
      'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'
    ];

    const SHIFT_COLOR_OPTIONS = [
      { id: 'amber', name: 'Naranja T1', bg: 'bg-[#ffdca8]', text: 'text-[#3d2304]' },
      { id: 'blue', name: 'Celeste T2', bg: 'bg-[#82cfff]', text: 'text-[#082f49]' },
      { id: 'emerald', name: 'Verde Libre', bg: 'bg-[#c3e6cb]', text: 'text-[#064e3b]' },
      { id: 'slate', name: 'Gris Feriado', bg: 'bg-[#94a3b8]', text: 'text-white' },
      { id: 'purple', name: 'Morado', bg: 'bg-[#e9d5ff]', text: 'text-[#581c87]' },
      { id: 'rose', name: 'Rosa', bg: 'bg-[#fecdd3]', text: 'text-[#881337]' },
      { id: 'yellow', name: 'Amarillo', bg: 'bg-[#fef08a]', text: 'text-[#713f12]' },
    ];

    // --- UTILIDADES ---
    const calculateNetHours = (start, end, breakMinutes) => {
      if (!start || !end) return 0;
      const [hStart, mStart] = start.split(':').map(Number);
      const [hEnd, mEnd] = end.split(':').map(Number);
      let minStart = (hStart * 60) + mStart;
      let minEnd = (hEnd * 60) + mEnd;
      if (minEnd <= minStart) minEnd += 24 * 60;
      const totalMinutes = minEnd - minStart - (parseInt(breakMinutes) || 0);
      return Math.max(0, totalMinutes / 60);
    };

    const formatCurrency = (amount) => {
      return new Intl.NumberFormat('es-CL', { style: 'currency', currency: 'CLP', maximumFractionDigits: 0 }).format(amount || 0);
    };

    // --- DATOS INICIALES CONFIGURABLES ---
    const INITIAL_LOCATIONS = [
      { id: 'loc-sp', name: 'Farmacia San Pablo', short: 'San Pablo', rut: 'RUT A', role: '2do QF (Semana)', color: '#0284c7' },
      { id: 'loc-cv1', name: 'Cruz Verde 1 (Sábado)', short: 'Cruz Verde #1', rut: 'RUT B', role: 'DT Sábados', color: '#059669' },
      { id: 'loc-cv2', name: 'Cruz Verde 2 (Domingo)', short: 'Cruz Verde #2', rut: 'RUT B', role: 'DT Domingos', color: '#0d9488' },
    ];

    const INITIAL_SHIFTS = [
      { id: 'T1', name: 'Turno Regular', start: '10:15', end: '18:30', breakMin: 60, bg: 'bg-[#ffdca8]', text: 'text-[#3d2304]', isOff: false },
      { id: 'T2', name: 'Turno DT Domingo', start: '09:00', end: '19:00', breakMin: 150, bg: 'bg-[#82cfff]', text: 'text-[#082f49]', isOff: false },
      { id: 'Libre', name: 'Descanso Libre', start: '', end: '', breakMin: 0, bg: 'bg-[#c3e6cb]', text: 'text-[#064e3b]', isOff: true },
      { id: 'F', name: 'Feriado Legal', start: '', end: '', breakMin: 0, bg: 'bg-[#94a3b8]', text: 'text-white', isOff: true },
    ];

    const INITIAL_SCHEDULES = {
      '2026-09': { "1": { shiftId: "T1", locationId: "loc-sp" }, "2": { shiftId: "T1", locationId: "loc-sp" }, "3": { shiftId: "T1", locationId: "loc-sp" }, "4": { shiftId: "T1", locationId: "loc-sp" }, "5": { shiftId: "T1", locationId: "loc-cv1" }, "6": { shiftId: "T2", locationId: "loc-cv2" }, "7": { shiftId: "Libre", locationId: "loc-sp" }, "8": { shiftId: "T1", locationId: "loc-sp" }, "9": { shiftId: "T1", locationId: "loc-sp" }, "10": { shiftId: "T1", locationId: "loc-sp" }, "11": { shiftId: "T1", locationId: "loc-sp" }, "12": { shiftId: "T1", locationId: "loc-cv1" }, "13": { shiftId: "Libre", locationId: "loc-sp" }, "14": { shiftId: "T1", locationId: "loc-sp" }, "15": { shiftId: "T1", locationId: "loc-sp" }, "16": { shiftId: "T1", locationId: "loc-sp" }, "17": { shiftId: "Libre", locationId: "loc-sp" }, "18": { shiftId: "F", locationId: "loc-sp" }, "19": { shiftId: "F", locationId: "loc-cv1" }, "20": { shiftId: "T2", locationId: "loc-cv2" }, "21": { shiftId: "Libre", locationId: "loc-sp" }, "22": { shiftId: "T1", locationId: "loc-sp" }, "23": { shiftId: "T1", locationId: "loc-sp" }, "24": { shiftId: "T1", locationId: "loc-sp" }, "25": { shiftId: "T1", locationId: "loc-sp" }, "26": { shiftId: "T1", locationId: "loc-cv1" }, "27": { shiftId: "Libre", locationId: "loc-sp" }, "28": { shiftId: "Libre", locationId: "loc-sp" }, "29": { shiftId: "T1", locationId: "loc-sp" }, "30": { shiftId: "T1", locationId: "loc-sp" } },
      '2026-10': { "1": { shiftId: "T1", locationId: "loc-sp" }, "2": { shiftId: "T1", locationId: "loc-sp" }, "3": { shiftId: "T1", locationId: "loc-cv1" }, "4": { shiftId: "T2", locationId: "loc-sp" }, "5": { shiftId: "Libre", locationId: "loc-sp" }, "6": { shiftId: "T1", locationId: "loc-sp" }, "7": { shiftId: "T1", locationId: "loc-sp" }, "8": { shiftId: "T1", locationId: "loc-sp" }, "9": { shiftId: "T1", locationId: "loc-sp" }, "10": { shiftId: "T1", locationId: "loc-cv1" }, "11": { shiftId: "Libre", locationId: "loc-cv2" }, "12": { shiftId: "F", locationId: "loc-sp" }, "13": { shiftId: "Libre", locationId: "loc-sp" }, "14": { shiftId: "T1", locationId: "loc-sp" }, "15": { shiftId: "T1", locationId: "loc-sp" }, "16": { shiftId: "T1", locationId: "loc-sp" }, "17": { shiftId: "T1", locationId: "loc-cv1" }, "18": { shiftId: "T2", locationId: "loc-sp" }, "19": { shiftId: "Libre", locationId: "loc-sp" }, "20": { shiftId: "T1", locationId: "loc-sp" }, "21": { shiftId: "T1", locationId: "loc-sp" }, "22": { shiftId: "T1", locationId: "loc-sp" }, "23": { shiftId: "T1", locationId: "loc-sp" }, "24": { shiftId: "T1", locationId: "loc-cv1" }, "25": { shiftId: "Libre", locationId: "loc-cv2" }, "26": { shiftId: "T1", locationId: "loc-sp" }, "27": { shiftId: "T1", locationId: "loc-sp" }, "28": { shiftId: "T1", locationId: "loc-sp" }, "29": { shiftId: "T1", locationId: "loc-sp" }, "30": { shiftId: "Libre", locationId: "loc-sp" }, "31": { shiftId: "F", locationId: "loc-cv1" } }
    };

    function App() {
      const [activeTab, setActiveTab] = useState('calendario');
      const [currentYear, setCurrentYear] = useState(2026);
      const [currentMonthIndex, setCurrentMonthIndex] = useState(8);
      
      const [shifts, setShifts] = useState(INITIAL_SHIFTS);
      const [locations, setLocations] = useState(INITIAL_LOCATIONS);
      const [schedules, setSchedules] = useState(INITIAL_SCHEDULES);
      
      const [targetSalary, setTargetSalary] = useState(1700000);
      const [targetHours, setTargetHours] = useState(40);
      const [dominicalSurchargePercent, setDominicalSurchargePercent] = useState(30);
      const nominalShiftHours = 7.25;

      const [activeBrushShift, setActiveBrushShift] = useState('T1');
      const [activeBrushLocation, setActiveBrushLocation] = useState('loc-sp');
      const [locationFilter, setLocationFilter] = useState('all');

      const [notification, setNotification] = useState(null);
      const [shiftModal, setShiftModal] = useState({ open: false, isNew: false, data: null });
      const [locationModal, setLocationModal] = useState({ open: false, isNew: false, data: null });

      const showToast = (msg, type = 'success') => {
        setNotification({ msg, type });
        setTimeout(() => setNotification(null), 2500);
      };

      const currentMonthKey = useMemo(() => `${currentYear}-${String(currentMonthIndex + 1).padStart(2, '0')}`, [currentYear, currentMonthIndex]);
      const currentSchedule = schedules[currentMonthKey] || {};

      const prevMonth = () => {
        if (currentMonthIndex === 0) { setCurrentMonthIndex(11); setCurrentYear(y => y - 1); } 
        else { setCurrentMonthIndex(m => m - 1); }
      };

      const nextMonth = () => {
        if (currentMonthIndex === 11) { setCurrentMonthIndex(0); setCurrentYear(y => y + 1); } 
        else { setCurrentMonthIndex(m => m + 1); }
      };

      // Malla 7 Columnas Estilo Shifter
      const calendarMatrix = useMemo(() => {
        const daysInMonth = new Date(currentYear, currentMonthIndex + 1, 0).getDate();
        const daysInPrevMonth = new Date(currentYear, currentMonthIndex, 0).getDate();
        let startOffset = new Date(currentYear, currentMonthIndex, 1).getDay() - 1;
        if (startOffset === -1) startOffset = 6;

        const weeks = [];
        let curWeek = [];

        for (let i = startOffset - 1; i >= 0; i--) curWeek.push({ day: daysInPrevMonth - i, isCurrent: false });

        for (let d = 1; d <= daysInMonth; d++) {
          curWeek.push({ day: d, isCurrent: true });
          if (curWeek.length === 7) { weeks.push(curWeek); curWeek = []; }
        }

        if (curWeek.length > 0) {
          let nextD = 1;
          while (curWeek.length < 7) curWeek.push({ day: nextD++, isCurrent: false });
          weeks.push(curWeek);
        }

        return weeks;
      }, [currentYear, currentMonthIndex]);

      const handleDayClick = (cell) => {
        if (!cell.isCurrent) return;
        const dayKey = String(cell.day);
        
        setSchedules(prev => {
          const monthObj = { ...(prev[currentMonthKey] || {}) };
          const currentEntry = monthObj[dayKey];

          if (currentEntry && currentEntry.shiftId === activeBrushShift && currentEntry.locationId === activeBrushLocation) {
            delete monthObj[dayKey];
          } else {
            monthObj[dayKey] = { shiftId: activeBrushShift, locationId: activeBrushLocation };
          }
          return { ...prev, [currentMonthKey]: monthObj };
        });
      };

      // Estadísticas y Doble Cómputo (Físicas vs Base 30 Días)
      const stats = useMemo(() => {
        const daysInMonth = new Date(currentYear, currentMonthIndex + 1, 0).getDate();
        let physicalHours = 0;
        let paidHolidayHours = 0;
        let sundayHours = 0;
        
        const hoursByLoc = {};
        const daysByLoc = {};
        locations.forEach(l => { hoursByLoc[l.id] = 0; daysByLoc[l.id] = 0; });
        let offDays = 0, holidays = 0;

        // Semanales
        const weekly = calendarMatrix.map(week => {
          let wPhys = 0, wHol = 0;
          week.forEach(c => {
            if (c.isCurrent) {
              const item = currentSchedule[String(c.day)];
              const dayOfWeek = new Date(currentYear, currentMonthIndex, c.day).getDay();

              if (item && (locationFilter === 'all' || item.locationId === locationFilter)) {
                const shift = shifts.find(s => s.id === item.shiftId);
                if (shift) {
                  if (!shift.isOff) wPhys += calculateNetHours(shift.start, shift.end, shift.breakMin);
                  else if (shift.id === 'F' && dayOfWeek !== 0) wHol += nominalShiftHours;
                }
              }
            }
          });
          return { physical: wPhys, contract: wPhys + wHol };
        });

        // Totales Mes
        for (let d = 1; d <= daysInMonth; d++) {
          const item = currentSchedule[String(d)];
          const dayOfWeek = new Date(currentYear, currentMonthIndex, d).getDay();
          
          if (item) {
            const shift = shifts.find(s => s.id === item.shiftId);
            if (shift) {
              if (shift.id === 'Libre') offDays++;
              if (shift.id === 'F') {
                holidays++;
                if (dayOfWeek !== 0) paidHolidayHours += nominalShiftHours;
              }

              if (!shift.isOff) {
                const h = calculateNetHours(shift.start, shift.end, shift.breakMin);
                if (hoursByLoc[item.locationId] !== undefined) {
                  hoursByLoc[item.locationId] += h;
                  daysByLoc[item.locationId] += 1;
                }
                if (dayOfWeek === 0) sundayHours += h;
                if (locationFilter === 'all' || item.locationId === locationFilter) physicalHours += h;
              }
            }
          }
        }

        const weeksInMonth = daysInMonth / 7;
        const avgPhysical = physicalHours / weeksInMonth;
        const avgContractual = (physicalHours + paidHolidayHours) / weeksInMonth;

        const hoursSanPablo = hoursByLoc['loc-sp'] || 0;
        let hoursCruzVerde = 0;
        Object.keys(hoursByLoc).forEach(lId => { if (lId !== 'loc-sp') hoursCruzVerde += hoursByLoc[lId]; });

        const baseRate = (hoursSanPablo + hoursCruzVerde) > 0 ? (targetSalary / (hoursSanPablo + hoursCruzVerde)) : (targetSalary / 160);
        const salarySanPablo = hoursSanPablo * baseRate;
        const sundayBonus = sundayHours * baseRate * (dominicalSurchargePercent / 100);
        const salaryCruzVerde = (hoursCruzVerde * baseRate) + sundayBonus;

        return {
          weekly, physicalHours, paidHolidayHours, contractualHours: physicalHours + paidHolidayHours,
          avgPhysical, avgContractual, sundayHours, hoursByLoc, daysByLoc, hoursSanPablo, hoursCruzVerde,
          salarySanPablo, salaryCruzVerde, sundayBonus, offDays, holidays
        };
      }, [calendarMatrix, currentSchedule, shifts, locations, locationFilter, currentYear, currentMonthIndex, targetSalary, dominicalSurchargePercent]);

      const saveShift = (e) => {
        e.preventDefault();
        const data = shiftModal.data;
        if (!data.id.trim() || !data.name.trim()) return;
        const cleanId = data.id.trim().toUpperCase();

        if (shiftModal.isNew) {
          if (shifts.some(s => s.id === cleanId)) { showToast('Ya existe este turno', 'error'); return; }
          setShifts(prev => [...prev, { ...data, id: cleanId }]);
          showToast(`Turno ${cleanId} creado`);
        } else {
          setShifts(prev => prev.map(s => s.id === data.id ? data : s));
          showToast(`Turno ${cleanId} actualizado`);
        }
        setShiftModal({ open: false, isNew: false, data: null });
      };

      const saveLocation = (e) => {
        e.preventDefault();
        const data = locationModal.data;
        if (!data.name.trim() || !data.short.trim()) return;

        if (locationModal.isNew) {
          setLocations(prev => [...prev, data]);
          showToast(`Local ${data.short} agregado`);
        } else {
          setLocations(prev => prev.map(l => l.id === data.id ? data : l));
          showToast(`Local ${data.short} actualizado`);
        }
        setLocationModal({ open: false, isNew: false, data: null });
      };

      const copyWhatsApp = () => {
        const text = `Estimado, junto con saludar, adjunto mi propuesta de calendario y turnos para el mes de ${MONTH_NAMES[currentMonthIndex]} ${currentYear}:

📌 RESUMEN DE JORNADA (BASE 30 DÍAS):
• Total horas presenciales: ${stats.physicalHours.toFixed(1)} hrs
• Promedio semanal (con feriados): ${stats.avgContractualWeekly.toFixed(1)} hrs/sem (Meta legal ${targetHours}h)

🏥 DISTRIBUCIÓN POR LOCAL:
• San Pablo (2do QF): ${stats.daysByLoc['loc-sp'] || 0} turnos
• Sábados DT (Cruz Verde 1): ${stats.daysByLoc['loc-cv1'] || 0} turnos
• Domingos DT (Cruz Verde 2): ${stats.daysByLoc['loc-cv2'] || 0} turnos

🛌 DÍAS DE DESCANSO COMPENSATORIO Y LIBRES:
• Lunes libres garantizados post-domingo de turno DT.
• Total días libres y feriados programados: ${stats.offDays + stats.holidays} días.

Quedo atento a tu confirmación para coordinar los contratos correspondientes. ¡Saludos cordiales!`;

        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showToast('¡Mensaje copiado para WhatsApp!');
      };

      // --- RENDER VISTAS ---
      const RenderCalendar = () => (
        <div className="flex-1 flex flex-col w-full max-w-md mx-auto">
          {/* Header Superior Oscuro Estilo Shifter */}
          <header className="bg-[#37474f] text-white">
            <div className="flex justify-between items-center px-4 py-2 border-b border-slate-600/50">
              <span className="text-teal-300 font-black text-xs uppercase tracking-wider">San Pablo & Cruz Verde</span>
              <div className="bg-slate-700/80 px-2 py-0.5 rounded flex gap-1 text-[10px] font-black">
                <span>META 40H:</span>
                <span className={stats.avgContractualWeekly > targetHours ? 'text-red-300' : 'text-emerald-300'}>{stats.avgContractualWeekly.toFixed(1)}h/s</span>
              </div>
            </div>
            <div className="flex items-center justify-between px-3 py-2.5">
              <button onClick={prevMonth} className="p-1 hover:bg-slate-700 rounded active:scale-95"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M15 18l-6-6 6-6"/></svg></button>
              <h1 className="font-black text-sm uppercase tracking-wider">{MONTH_NAMES[currentMonthIndex]} {currentYear}</h1>
              <button onClick={nextMonth} className="p-1 hover:bg-slate-700 rounded active:scale-95"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M9 18l6-6-6-6"/></svg></button>
            </div>
          </header>

          <div className="p-2 sm:p-3 bg-slate-50 flex-1 space-y-2">
            
            {/* Control Rápido */}
            <div className="flex justify-between items-center bg-white px-2 py-1.5 rounded-lg border border-slate-200 text-xs shadow-sm">
              <div className="flex items-center gap-1">
                <span className="text-[11px] font-bold text-slate-500">📍 Local:</span>
                <select value={locationFilter} onChange={e => setLocationFilter(e.target.value)} className="text-xs font-bold bg-transparent outline-none text-slate-800 cursor-pointer">
                  <option value="all">Todos los Locales</option>
                  {locations.map(l => <option key={l.id} value={l.id}>{l.short}</option>)}
                </select>
              </div>
              <div className="text-[11px] font-bold flex gap-1.5">
                <span className="text-slate-500">Promedio Físico: </span>
                <span className="text-slate-800">{stats.avgPhysical.toFixed(1)}h/sem</span>
              </div>
            </div>

            {/* Malla 7 Columnas */}
            <div className="bg-white rounded-lg border-2 border-slate-900 overflow-hidden shadow-sm">
              <div className="grid grid-cols-7 border-b border-slate-900 bg-slate-100 text-center text-[10px] sm:text-xs font-black uppercase text-slate-700">
                <div className="py-1">LUN</div><div className="py-1">MAR</div><div className="py-1">MIÉ</div>
                <div className="py-1">JUE</div><div className="py-1">VIE</div><div className="py-1 text-blue-700">SÁB</div><div className="py-1 text-blue-700">DOM</div>
              </div>

              {calendarMatrix.map((week, wI) => (
                <div key={wI} className="grid grid-cols-7 border-b border-slate-200 last:border-b-0">
                  {week.map((cell, cI) => {
                    if (!cell.isCurrent) return <div key={cI} className="h-16 border-r border-slate-200 last:border-r-0 bg-slate-50/70 p-1 flex flex-col justify-start"><span className="text-[10px] font-semibold text-slate-300">{cell.day}</span></div>;
                    
                    const fDate = `${currentYear}-${String(currentMonthIndex + 1).padStart(2, '0')}-${String(cell.day).padStart(2, '0')}`;
                    const hol = CHILE_HOLIDAYS[fDate];
                    const item = currentSchedule[String(cell.day)];
                    const s = item ? shifts.find(x => x.id === item.shiftId) : null;
                    const l = item ? locations.find(x => x.id === item.locationId) : null;
                    const isDimmed = item && locationFilter !== 'all' && item.locationId !== locationFilter;
                    
                    const bg = s ? s.bg : (hol ? 'bg-[#94a3b8]' : 'bg-white');
                    const txt = s ? s.text : (hol ? 'text-white' : 'text-slate-800');

                    return (
                      <div key={cI} onClick={() => handleDayClick(cell)} className={`relative h-16 p-1 border-r border-slate-300 last:border-r-0 cursor-pointer flex flex-col justify-between transition-all select-none ${bg} ${txt} ${isDimmed ? 'opacity-20 grayscale' : 'active:scale-95'}`}>
                        <div className="flex justify-between items-start leading-none pointer-events-none">
                          {hol ? <span className={`text-[7px] font-black px-0.5 rounded leading-none ${hol.irrenunciable ? 'bg-rose-600 text-white' : 'bg-rose-200 text-rose-900'}`}>F</span> : <span className="w-1"/>}
                          <span className={`text-[10px] sm:text-xs font-black ${hol && !s ? 'text-rose-100' : ''}`}>{cell.day}</span>
                        </div>
                        
                        {s ? (
                          <div className="text-center my-auto pointer-events-none"><span className="font-black text-xs sm:text-sm tracking-tight leading-none block">{s.id}</span></div>
                        ) : (hol && <div className="text-[7px] font-bold text-white text-center truncate pointer-events-none">Feriado</div>)}

                        {s && l && (
                          <div className="flex justify-center pointer-events-none">
                            <span className="text-[7px] font-bold px-1 rounded truncate max-w-[95%] text-white leading-tight" style={{backgroundColor: l.color}}>{l.short}</span>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              ))}
            </div>

            {/* Resumen Semanal Compacto Estilo Shifter */}
            <div className="bg-white rounded-lg p-2 border border-slate-200 shadow-sm flex items-center justify-between text-xs font-bold overflow-x-auto no-scrollbar">
              <span className="text-[10px] text-slate-500 uppercase tracking-tight font-black mr-2 whitespace-nowrap">SEMANAS:</span>
              <div className="flex gap-1">
                {stats.weekly.map((w, idx) => (
                  <span key={idx} className={`text-[9px] sm:text-[10px] px-1.5 py-0.5 rounded font-black whitespace-nowrap ${w.contract > targetHours ? 'bg-red-100 text-red-800' : 'bg-slate-100 text-slate-700'}`}>
                    S{idx + 1}: {w.contract.toFixed(0)}h
                  </span>
                ))}
              </div>
            </div>

            {/* Selector de Pincel Rápido Inferior */}
            <div className="bg-white p-2 rounded-lg border border-slate-200 shadow-sm space-y-2">
              <div className="flex items-center justify-between">
                <span className="text-[10px] font-black uppercase text-slate-500">Pincel Activo:</span>
                <select value={activeBrushLocation} onChange={e => setActiveBrushLocation(e.target.value)} className="text-xs font-bold bg-slate-100 border border-slate-300 rounded px-1.5 py-0.5 outline-none max-w-[150px] truncate">
                  {locations.map(l => <option key={l.id} value={l.id}>{l.short}</option>)}
                </select>
              </div>
              <div className="grid grid-cols-4 gap-1.5">
                {shifts.map(s => (
                  <button key={s.id} onClick={() => setActiveBrushShift(s.id)} className={`py-1 px-1 rounded-md border text-center font-black text-xs transition-all ${s.bg} ${s.text} ${activeBrushShift === s.id ? 'border-slate-900 shadow-md ring-2 ring-slate-900/40 scale-[1.02]' : 'border-transparent opacity-85'}`}>
                    {s.id}
                  </button>
                ))}
              </div>
            </div>
          </div>
        </div>
      );

      const RenderShifts = () => (
        <div className="p-4 w-full max-w-md mx-auto space-y-4 animate-in fade-in">
          <div className="flex justify-between items-center border-b border-slate-200 pb-2">
            <div>
              <h2 className="text-base font-black text-slate-900">Horarios y Turnos</h2>
              <p className="text-[11px] text-slate-500">Configura entradas, salidas y colación.</p>
            </div>
            <button onClick={() => setShiftModal({ open: true, isNew: true, data: { id: '', name: '', start: '10:00', end: '18:30', breakMin: 60, bg: 'bg-[#ffdca8]', text: 'text-[#3d2304]', isOff: false } })} className="bg-slate-900 text-white text-xs font-bold px-3 py-1.5 rounded-lg active:scale-95">+ Turno</button>
          </div>
          <div className="space-y-2">
            {shifts.map(s => (
              <div key={s.id} className="bg-white p-3 rounded-xl border border-slate-200 flex items-center justify-between shadow-sm">
                <div className="flex items-center gap-3">
                  <div className={`w-10 h-10 rounded-lg border border-slate-800 flex items-center justify-center font-black text-xs ${s.bg} ${s.text}`}>{s.id}</div>
                  <div>
                    <h4 className="text-xs font-bold text-slate-900">{s.name}</h4>
                    <p className="text-[11px] text-slate-500">{s.isOff ? 'Libre / Feriado' : `${s.start} - ${s.end} (${s.breakMin}m col. = ${calculateNetHours(s.start, s.end, s.breakMin)}h)`}</p>
                  </div>
                </div>
                <div className="flex gap-1">
                  <button onClick={() => setShiftModal({ open: true, isNew: false, data: { ...s } })} className="bg-slate-100 p-2 rounded text-xs font-bold text-slate-700">✏️</button>
                  <button onClick={() => { if(shifts.length>1) setShifts(prev => prev.filter(x => x.id !== s.id)); }} className="bg-rose-50 p-2 rounded text-xs font-bold text-rose-600">🗑️</button>
                </div>
              </div>
            ))}
          </div>
        </div>
      );

      const RenderLocations = () => (
        <div className="p-4 w-full max-w-md mx-auto space-y-4 animate-in fade-in">
          <div className="flex justify-between items-center border-b border-slate-200 pb-2">
            <div>
              <h2 className="text-base font-black text-slate-900">Locales y Sucursales</h2>
              <p className="text-[11px] text-slate-500">Administra las razones sociales y RUTs.</p>
            </div>
            <button onClick={() => setLocationModal({ open: true, isNew: true, data: { id: `loc-${Date.now()}`, name: '', short: '', rut: 'RUT Empresa', role: 'QF', color: '#059669' } })} className="bg-slate-900 text-white text-xs font-bold px-3 py-1.5 rounded-lg active:scale-95">+ Local</button>
          </div>
          <div className="space-y-2">
            {locations.map(l => (
              <div key={l.id} className="bg-white p-3 rounded-xl border border-slate-200 flex items-center justify-between shadow-sm">
                <div className="flex items-center gap-2.5">
                  <div className="w-3 h-10 rounded-full" style={{ backgroundColor: l.color }}></div>
                  <div>
                    <div className="flex items-center gap-1.5">
                      <h4 className="text-xs font-bold text-slate-900">{l.name}</h4>
                      <span className="text-[9px] font-black text-white px-1.5 py-0.5 rounded" style={{ backgroundColor: l.color }}>{l.short}</span>
                    </div>
                    <p className="text-[10px] text-slate-500 mt-0.5">{l.rut} • {l.role}</p>
                    <p className="text-[10px] text-emerald-700 font-bold mt-1">{stats.daysByLoc[l.id] || 0} turnos ({(stats.hoursByLoc[l.id] || 0).toFixed(1)} hrs)</p>
                  </div>
                </div>
                <div className="flex gap-1">
                  <button onClick={() => setLocationModal({ open: true, isNew: false, data: { ...l } })} className="bg-slate-100 p-2 rounded text-xs font-bold text-slate-700">✏️</button>
                  <button onClick={() => { if(locations.length>1) setLocations(prev => prev.filter(x => x.id !== l.id)); }} className="bg-rose-50 p-2 rounded text-xs font-bold text-rose-600">🗑️</button>
                </div>
              </div>
            ))}
          </div>
        </div>
      );

      const RenderSalary = () => (
        <div className="p-4 w-full max-w-md mx-auto space-y-3.5 animate-in fade-in">
          <div className="flex justify-between items-center border-b border-slate-200 pb-2">
            <div>
              <h2 className="text-base font-black text-slate-900">Sueldo Base 30 Días</h2>
              <p className="text-[11px] text-slate-500">Cálculo de los 2 contratos y 30% dominical.</p>
            </div>
            <span className="text-xs font-black text-emerald-700 bg-emerald-100 px-2 py-1 rounded">{formatCurrency(targetSalary)}</span>
          </div>

          <div className="bg-emerald-50 border-l-4 border-emerald-600 p-3 rounded-r-xl text-[11px] text-emerald-950 shadow-sm leading-relaxed">
            <span className="font-black uppercase text-[10px] block text-emerald-800 mb-0.5">📌 Protección Ley 30 Días:</span>
            Los feriados irrenunciables y legales en semana se pagan automáticamente. No disminuyen tu sueldo mensual ni te obligan a reponer horas físicas.
          </div>

          <div className="bg-white rounded-xl border border-sky-300 p-3 shadow-sm space-y-1.5 text-xs">
            <span className="text-[9px] font-black uppercase bg-sky-100 text-sky-900 px-2 py-0.5 rounded">Contrato 1 • San Pablo (RUT A)</span>
            <div className="flex justify-between items-center pt-1"><span className="font-bold">2do QF (Semana)</span><span className="text-sm font-black text-sky-800">{formatCurrency(stats.salarySanPablo)}</span></div>
            <p className="text-slate-500 text-[11px]">{stats.daysByLoc['loc-sp'] || 0} turnos • {stats.hoursSanPablo.toFixed(1)} hrs</p>
          </div>

          <div className="bg-white rounded-xl border border-emerald-300 p-3 shadow-sm space-y-1.5 text-xs">
            <span className="text-[9px] font-black uppercase bg-emerald-100 text-emerald-900 px-2 py-0.5 rounded">Contrato 2 • Cruz Verde (RUT B)</span>
            <div className="flex justify-between items-center pt-1"><span className="font-bold">DT Reemplazo (Sáb y Dom)</span><span className="text-sm font-black text-emerald-800">{formatCurrency(stats.salaryCruzVerde)}</span></div>
            <div className="pt-1 border-t border-slate-100 text-[11px] text-emerald-800 flex justify-between font-bold">
              <span>Recargo Dominical ${dominicalSurchargePercent}%:</span><span>+{formatCurrency(stats.sundayBonus)}</span>
            </div>
          </div>

          <div className="bg-white p-3 rounded-xl border border-slate-200 text-xs shadow-sm">
            <h3 className="font-black text-slate-700 uppercase text-[10px] mb-2">Ajustar Parámetros</h3>
            <div className="grid grid-cols-2 gap-2">
              <div>
                <label className="text-[10px] text-slate-500 font-bold block">Sueldo Líquido</label>
                <input type="number" step="50000" value={targetSalary} onChange={e => setTargetSalary(Number(e.target.value)||0)} className="w-full bg-slate-50 border border-slate-300 rounded p-1.5 font-bold"/>
              </div>
              <div>
                <label className="text-[10px] text-slate-500 font-bold block">Jornada Meta</label>
                <input type="number" value={targetHours} onChange={e => setTargetHours(Number(e.target.value)||40)} className="w-full bg-slate-50 border border-slate-300 rounded p-1.5 font-bold"/>
              </div>
            </div>
          </div>
        </div>
      );

      const RenderTips = () => (
        <div className="p-4 w-full max-w-md mx-auto space-y-3.5 animate-in fade-in">
          <div className="border-b border-slate-200 pb-2">
            <h2 className="text-base font-black text-slate-900">💡 Tips y Estrategias</h2>
            <p className="text-[11px] text-slate-500">Mejora tus horarios de farmacia.</p>
          </div>
          <div className="bg-white p-3.5 rounded-xl border-l-4 border-amber-500 shadow-sm space-y-1.5">
            <div className="flex items-center justify-between"><h3 className="font-black text-xs text-amber-900 uppercase">1. Adelantar Salida Sábado</h3><span className="text-[9px] font-bold bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded">Recomendado</span></div>
            <p className="text-[11px] text-slate-700">Si sales a las 19:00 de martes a viernes en San Pablo (+30 min diarios), puedes pedir que tu turno en Cruz Verde del sábado sea solo de 10:00 a 13:00. Mantienes 40h y ganas tu tarde libre.</p>
          </div>
          <div className="bg-white p-3.5 rounded-xl border-l-4 border-sky-500 shadow-sm space-y-1.5">
            <div class="flex items-center justify-between"><h3 className="font-black text-xs text-sky-900 uppercase">2. Acortar Colación Domingo</h3><span className="text-[9px] font-bold bg-sky-100 text-sky-800 px-1.5 py-0.5 rounded">Vital</span></div>
            <p className="text-[11px] text-slate-700">Tienes 2.5h de colación en domingo. Si acuerdas solo 1 hora (09:00 a 17:30), cumples las mismas 7.5h netas, cobras igual tu recargo y te vas 1 hora y media antes a casa.</p>
          </div>
          <div className="bg-white p-3.5 rounded-xl border-l-4 border-purple-500 shadow-sm space-y-1.5">
            <div class="flex items-center justify-between"><h3 className="font-black text-xs text-purple-900 uppercase">3. Días Libres Flotantes</h3><span className="text-[9px] font-bold bg-purple-100 text-purple-800 px-1.5 py-0.5 rounded">Estrategia</span></div>
            <p className="text-[11px] text-slate-700">En la semana que NO trabajas el domingo en Cruz Verde, intenta pedir tu día libre un lunes o viernes. Así consigues fines de semana largos programados.</p>
          </div>
        </div>
      );

      return (
        <div className="flex-1 flex flex-col relative w-full">
          {notification && (
            <div className={`fixed top-3 left-1/2 -translate-x-1/2 z-[10001] px-4 py-2 rounded-xl shadow-2xl text-xs font-bold text-white flex items-center gap-2 transition-all ${notification.type === 'error' ? 'bg-rose-600' : 'bg-emerald-600'}`}>
              <span>{notification.msg}</span>
            </div>
          )}

          {activeTab === 'calendario' && <RenderCalendar />}
          {activeTab === 'turnos' && <RenderShifts />}
          {activeTab === 'locales' && <RenderLocations />}
          {activeTab === 'sueldos' && <RenderSalary />}
          {activeTab === 'sugerencias' && <RenderTips />}
          {activeTab === 'whatsapp' && (
            <div className="p-4 w-full max-w-md mx-auto space-y-3 animate-in fade-in">
              <h2 className="text-base font-black text-slate-900">Mensaje para Empleador</h2>
              <div className="bg-white p-3 rounded-xl border border-slate-300 text-[11px] font-mono whitespace-pre-wrap leading-relaxed shadow-sm">
{`Estimado, adjunto propuesta de turnos para ${MONTH_NAMES[currentMonthIndex]} ${currentYear}:

📌 RESUMEN DE JORNADA:
• Promedio semanal (con feriados legales): ${stats.avgContractualWeekly.toFixed(1)} hrs/sem (Meta legal ${targetHours}h)

🏥 DISTRIBUCIÓN POR LOCAL:
• San Pablo (Semana): ${stats.daysByLoc['loc-sp'] || 0} turnos
• Sábados DT (Cruz Verde 1): ${stats.daysByLoc['loc-cv1'] || 0} turnos
• Domingos DT (Cruz Verde 2): ${stats.daysByLoc['loc-cv2'] || 0} turnos

🛌 DÍAS LIBRES Y FERIADOS:
• Total mes: ${stats.offDays + stats.holidays} días (Lunes libres post-domingo DT).

Quedo atento a tu confirmación. Saludos!`}
              </div>
              <button onClick={copyWhatsApp} className="w-full bg-emerald-600 text-white font-black text-xs py-3 rounded-xl shadow-md active:scale-95">📋 Copiar para WhatsApp</button>
            </div>
          )}

          {/* Menú de Navegación Inferior Flotante (Anti-banners Tiiny.host) */}
          <nav className="fixed bottom-4 left-4 right-4 z-[9999] bg-[#263238] text-white rounded-2xl shadow-[0_20px_50px_rgba(0,0,0,0.5)] border border-slate-700 overflow-hidden">
            <div className="flex text-center font-bold text-[9px]">
              <button onClick={() => setActiveTab('calendario')} className={`flex-1 py-2 transition-all ${activeTab === 'calendario' ? 'bg-[#37474f] text-teal-300 border-t-2 border-teal-300' : 'text-slate-400'}`}><span className="block text-lg mb-0.5">📅</span><span>PINTAR</span></button>
              <button onClick={() => setActiveTab('turnos')} className={`flex-1 py-2 transition-all ${activeTab === 'turnos' ? 'bg-[#37474f] text-teal-300 border-t-2 border-teal-300' : 'text-slate-400'}`}><span className="block text-lg mb-0.5">⚙️</span><span>TURNOS</span></button>
              <button onClick={() => setActiveTab('sueldos')} className={`flex-1 py-2 transition-all ${activeTab === 'sueldos' ? 'bg-[#37474f] text-teal-300 border-t-2 border-teal-300' : 'text-slate-400'}`}><span className="block text-lg mb-0.5">💰</span><span>SUELDO</span></button>
              <button onClick={() => setActiveTab('sugerencias')} className={`flex-1 py-2 transition-all ${activeTab === 'sugerencias' ? 'bg-[#37474f] text-teal-300 border-t-2 border-teal-300' : 'text-slate-400'}`}><span className="block text-lg mb-0.5">💡</span><span>TIPS</span></button>
              <button onClick={() => setActiveTab('whatsapp')} className={`flex-1 py-2 transition-all ${activeTab === 'whatsapp' ? 'bg-[#37474f] text-teal-300 border-t-2 border-teal-300' : 'text-slate-400'}`}><span className="block text-lg mb-0.5">📤</span><span>ENVIAR</span></button>
            </div>
          </nav>

          {/* Modales de Edición */}
          {shiftModal.open && (
            <div className="fixed inset-0 bg-black/60 z-[10000] flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-xs w-full p-4 shadow-2xl">
                <div className="flex justify-between items-center border-b pb-2 mb-3">
                  <h3 className="font-black text-xs">{shiftModal.isNew ? 'Nuevo Turno' : `Editar ${shiftModal.data.id}`}</h3>
                  <button onClick={() => setShiftModal({open: false, isNew: false, data: null})} className="font-bold text-slate-400">✕</button>
                </div>
                <form onSubmit={saveShift} className="space-y-2 text-xs">
                  <div><label className="block text-[10px] font-bold text-slate-500">Código</label><input type="text" maxLength={5} disabled={!shiftModal.isNew} value={shiftModal.data.id} onChange={e => setShiftModal({...shiftModal, data: {...shiftModal.data, id: e.target.value}})} className="w-full bg-slate-50 border rounded p-1.5 font-bold uppercase" required/></div>
                  <div><label className="block text-[10px] font-bold text-slate-500">Nombre</label><input type="text" value={shiftModal.data.name} onChange={e => setShiftModal({...shiftModal, data: {...shiftModal.data, name: e.target.value}})} className="w-full bg-slate-50 border rounded p-1.5 font-bold" required/></div>
                  <div>
                    <label className="block text-[10px] font-bold text-slate-500">Tipo</label>
                    <select value={shiftModal.data.isOff} onChange={e => setShiftModal({...shiftModal, data: {...shiftModal.data, isOff: e.target.value === 'true'}})} className="w-full bg-slate-50 border rounded p-1.5 font-bold">
                      <option value={false}>Día de Trabajo</option><option value={true}>Día Libre / Feriado</option>
                    </select>
                  </div>
                  {!shiftModal.data.isOff && (
                    <div className="grid grid-cols-2 gap-2 bg-slate-50 p-2 rounded border">
                      <div><label className="block text-[9px] font-bold text-slate-500">Entrada</label><input type="time" value={shiftModal.data.start} onChange={e => setShiftModal({...shiftModal, data: {...shiftModal.data, start: e.target.value}})} className="w-full bg-white border rounded p-1"/></div>
                      <div><label className="block text-[9px] font-bold text-slate-500">Salida</label><input type="time" value={shiftModal.data.end} onChange={e => setShiftModal({...shiftModal, data: {...shiftModal.data, end: e.target.value}})} className="w-full bg-white border rounded p-1"/></div>
                      <div className="col-span-2"><label className="block text-[9px] font-bold text-slate-500">Minutos Colación</label><input type="number" step="15" value={shiftModal.data.breakMin} onChange={e => setShiftModal({...shiftModal, data: {...shiftModal.data, breakMin: Number(e.target.value)||0}})} className="w-full bg-white border rounded p-1"/></div>
                    </div>
                  )}
                  <div>
                    <label className="block text-[10px] font-bold text-slate-500 mb-1">Color</label>
                    <div className="grid grid-cols-4 gap-1">
                      {SHIFT_COLOR_OPTIONS.map(c => (
                        <button type="button" key={c.id} onClick={() => setShiftModal({...shiftModal, data: {...shiftModal.data, bg: c.bg, text: c.text}})} className={`p-1.5 rounded text-[9px] font-black ${c.bg} ${c.text} ${shiftModal.data.bg === c.bg ? 'ring-2 ring-slate-900 scale-105' : ''}`}>{c.id}</button>
                      ))}
                    </div>
                  </div>
                  <div className="flex gap-2 pt-2">
                    <button type="button" onClick={() => setShiftModal({open: false, isNew: false, data: null})} className="flex-1 bg-slate-100 py-2 rounded text-slate-700 font-bold">Cancelar</button>
                    <button type="submit" className="flex-1 bg-slate-900 py-2 rounded text-white font-bold">Guardar</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {locationModal.open && (
            <div className="fixed inset-0 bg-black/60 z-[10000] flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-xs w-full p-4 shadow-2xl">
                <div className="flex justify-between items-center border-b pb-2 mb-3">
                  <h3 className="font-black text-xs">{locationModal.isNew ? 'Nuevo Local' : `Editar ${locationModal.data.short}`}</h3>
                  <button onClick={() => setLocationModal({open: false, isNew: false, data: null})} className="font-bold text-slate-400">✕</button>
                </div>
                <form onSubmit={saveLocation} className="space-y-2 text-xs">
                  <div><label className="block text-[10px] font-bold text-slate-500">Nombre</label><input type="text" value={locationModal.data.name} onChange={e => setLocationModal({...locationModal, data: {...locationModal.data, name: e.target.value}})} className="w-full bg-slate-50 border rounded p-1.5 font-bold" required/></div>
                  <div className="grid grid-cols-2 gap-2">
                    <div><label className="block text-[10px] font-bold text-slate-500">Sigla (Malla)</label><input type="text" maxLength={10} value={locationModal.data.short} onChange={e => setLocationModal({...locationModal, data: {...locationModal.data, short: e.target.value}})} className="w-full bg-slate-50 border rounded p-1.5 font-bold" required/></div>
                    <div><label className="block text-[10px] font-bold text-slate-500">Color</label><input type="color" value={locationModal.data.color} onChange={e => setLocationModal({...locationModal, data: {...locationModal.data, color: e.target.value}})} className="w-full h-8 rounded border p-0.5 bg-slate-50"/></div>
                  </div>
                  <div><label className="block text-[10px] font-bold text-slate-500">RUT / Sociedad</label><input type="text" value={locationModal.data.rut} onChange={e => setLocationModal({...locationModal, data: {...locationModal.data, rut: e.target.value}})} className="w-full bg-slate-50 border rounded p-1.5 font-bold"/></div>
                  <div className="flex gap-2 pt-2">
                    <button type="button" onClick={() => setLocationModal({open: false, isNew: false, data: null})} className="flex-1 bg-slate-100 py-2 rounded text-slate-700 font-bold">Cancelar</button>
                    <button type="submit" className="flex-1 bg-slate-900 py-2 rounded text-white font-bold">Guardar</button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
